[project]
name = "tech-speech-trainer"
version = "0.1.0"
description = "English listening practice for Russian-speaking software developers."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi",
    "jinja2",
    "python-multipart>=0.0.32",
    "uvicorn",
]

[dependency-groups]
audio = [
    "piper-tts>=1.8.0",
]
dev = [
    "httpx2>=2.13.0",
    "pytest",
    "ruff",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
extend-exclude = ["docs", "models", "var"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
